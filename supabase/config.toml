# Supabase CLI configuration for LOCAL development only (`supabase start`).
# Hosted projects are configured in the Supabase dashboard; see the README.
# Every key not listed here uses the CLI default.

# Local identifier for the Docker containers. Not a hosted project ref.
project_id = "autoblog"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher: magic-link emails show up at http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
# Where the Next.js dev server runs. Magic links redirect to /auth/callback.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Required for the first magic-link sign-in of an allowlisted admin. The app
# only sends links to ADMIN_EMAILS, and RLS gives other users no access.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "10s"
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
